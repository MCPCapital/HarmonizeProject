[hue]
entertainment_area = "TV area"
credentials_file = "/etc/harmonize/client.json"

[capture]
device_path = "/dev/v4l/by-id/usb-MACROSILICON_WARRKY_USB_3.0_62196249-video-index0"
backend = "v4l2"

[control]
provider = "local"
socket_path = "/run/harmonize/harmonize.sock"
automatic_stale_seconds = 30.0
automatic_enable_debounce_seconds = 1.0
automatic_disable_grace_seconds = 5.0
recovery_attempts = 3
recovery_initial_seconds = 1.0

[ambilight]
video_wait_seconds = 2.0
brightness_adjustment = 0
color_processing_mode = "direct_rgb"
auto_restart_seconds = 0.0
single_light = false
sample_breadth = 0.15
update_interval_seconds = 0.033
exception_cleanup_behavior = "restore"

[logging]
level = "INFO"

[light_state]
journal_file = "/var/lib/harmonize/light-state.json"
stale_after_seconds = 300.0
restore_attempts = 3
retry_seconds = 0.5

[reliability]
startup_timeout_seconds = 10.0
shutdown_timeout_seconds = 15.0
capture_read_timeout_seconds = 2.0
capture_reconnect_initial_seconds = 0.5
capture_reconnect_max_seconds = 5.0
transport_reconnect_attempts = 3
transport_reconnect_initial_seconds = 0.5
hue_status_interval_seconds = 10.0
health_interval_seconds = 1.0
health_file = "/run/harmonize/health.json"
